<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Snakes</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Snakes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{--bg:#0a0a0a;--card:#161616;--btn:#242424;--txt:#ffffff;--dim:#9a9a9a;--accent:#e11d2e;--red:#e11d2e}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);overflow:hidden;overscroll-behavior:none;touch-action:none;
    font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  button{font:inherit;color:inherit;border:0;cursor:pointer}
  button:active{transform:scale(.93)}
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 16px)}
  .hide{display:none!important}

  /* game header */
  #bar{display:flex;align-items:center;gap:10px;height:56px;flex:none}
  .ico{width:48px;height:48px;border-radius:50%;background:var(--btn);display:grid;place-items:center;position:relative;flex:none}
  .ico svg{width:24px;height:24px;fill:none;stroke:var(--txt);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .badge{position:absolute;top:-3px;right:-3px;background:var(--accent);color:#fff;font-size:12px;font-weight:800;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 5px}
  #hearts{flex:1;display:flex;justify-content:center;gap:6px}
  #hearts svg{width:30px;height:30px}
  #prog{height:8px;border-radius:4px;background:#262626;margin:12px 4px 4px;overflow:hidden;flex:none}
  #progFill{height:100%;width:0;background:var(--accent);border-radius:4px;transition:width .3s}
  #lvlLabel{text-align:center;color:var(--dim);font-weight:700;font-size:13px;letter-spacing:.12em;margin-top:6px;flex:none}
  #stage{flex:1;position:relative;min-height:0;overflow:hidden}
  canvas{position:absolute;inset:0;width:100%;height:100%}

  /* home */
  #home{align-items:center;justify-content:center;text-align:center;background:radial-gradient(120% 70% at 50% 0%,#3a0a10 0%,var(--bg) 60%)}
  #home img{width:120px;height:120px;border-radius:28px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
  #home h1{font-size:40px;margin:22px 0 4px;letter-spacing:.02em}
  #home .sub{color:var(--dim);font-weight:700;margin:0 0 34px;font-size:16px}
  .big{width:min(320px,80vw);height:62px;border-radius:31px;background:var(--accent);color:#fff;font-size:22px;font-weight:800;box-shadow:0 6px 0 #8f0f1b}
  .big:active{transform:translateY(4px);box-shadow:0 2px 0 #8f0f1b}
  .row{display:flex;gap:12px;margin-top:16px;width:min(320px,80vw)}
  .pill{flex:1;height:52px;border-radius:26px;background:var(--btn);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
  .pill svg{width:20px;height:20px;fill:none;stroke:var(--txt);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  #how{color:var(--dim);font-size:14px;line-height:1.5;max-width:300px;margin-top:30px}
  #iosTip{color:var(--dim);font-size:13px;margin-top:14px}
  #ver{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 14px);color:#555;font-size:12px;font-weight:600;letter-spacing:.05em}

  /* result sheet */
  #sheetWrap{position:fixed;inset:0;background:rgba(5,7,12,.6);display:flex;align-items:flex-end;justify-content:center}
  #sheet{width:100%;max-width:520px;background:var(--card);border-radius:26px 26px 0 0;padding:26px 22px calc(env(safe-area-inset-bottom) + 22px);text-align:center;animation:up .28s ease-out}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  #sheet h2{margin:0 0 6px;font-size:28px}
  #sheet p{margin:0 0 20px;color:var(--dim);font-weight:600}
  #sheet .big{width:100%}
  #sheet .row{width:100%}
  #toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 30px);transform:translateX(-50%);background:var(--txt);color:var(--bg);font-weight:800;padding:12px 20px;border-radius:24px}
</style>
</head>
<body>

<!-- HOME SCREEN -->
<div id="home" class="screen">
  <img src="icon-512.png" alt="">
  <h1>Snakes</h1>
  <p class="sub" id="homeLvl">Level 1</p>
  <button class="big" id="play">Play</button>
  <div class="row">
    <button class="pill" id="shareHome"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>Share</button>
    <button class="pill hide" id="install"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Install</button>
  </div>
  <p id="iosTip" class="hide">To install: tap Share, then Add to Home Screen</p>
  <div id="ver"></div>
  <p id="how">Tap a snake to send it out the way its head points. Hit something and you lose a heart. Clear a board with no crashes to earn one back, up to 3.</p>
</div>

<!-- GAME SCREEN -->
<div id="game" class="screen hide">
  <div id="bar">
    <button class="ico" id="homeBtn" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="ico" id="restart" aria-label="Restart"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v5h5"/></svg></button>
    <div id="hearts"></div>
    <button class="ico" id="hint" aria-label="Hint"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg><span class="badge" id="hintN">3</span></button>
    <button class="ico" id="share" aria-label="Share"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></button>
  </div>
  <div id="prog"><div id="progFill"></div></div>
  <div id="lvlLabel">LEVEL 1</div>
  <div id="stage"><canvas id="c"></canvas>
  </div>
</div>

<!-- RESULT SHEET -->
<div id="sheetWrap" class="hide">
  <div id="sheet">
    <h2 id="sTitle">Board clear!</h2>
    <p id="sMsg"></p>
    <button class="big" id="sBtn">Next level</button>
    <div class="row">
      <button class="pill" id="sHome">Home</button>
      <button class="pill" id="sShare"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>Share</button>
    </div>
  </div>
</div>

<div id="toast" class="hide">Link copied</div>

<script>
const $=id=>document.getElementById(id);
// Bump on every update so you can tell the new build loaded.
const APP_VERSION='2.0';
const APP_DATE='Nov 22, 2026';
$('ver').textContent='Version '+APP_VERSION+' · '+APP_DATE;
const cv=$('c'),ctx=cv.getContext('2d');
const DIRS=[[-1,0],[0,1],[1,0],[0,-1]]; // up,right,down,left
const SNAKE='#ffffff';
const HEART='<svg viewBox="0 0 24 24"><path fill="FILL" d="M12 21s-7.5-4.6-9.6-9.2C1 8.6 3 5 6.6 5c2.1 0 3.6 1.2 5.4 3.2C13.8 6.2 15.3 5 17.4 5 21 5 23 8.6 21.6 11.8 19.5 16.4 12 21 12 21z"/></svg>';

let level=1; try{level=+localStorage.getItem('so_level')||1}catch(e){}
let R,C,grid,pieces,hearts,hints,cs,ox,oy,W,H,state='menu',hintPiece=-1,hintUntil=0,total=0,mistakes=0;
// Hearts carry over between levels: start with 1, earn 1 per perfect board, max 3.
hearts=1;try{hearts=Math.min(3,+localStorage.getItem('so_lives')||1)}catch(e){}
function saveLives(){try{localStorage.setItem('so_lives',hearts)}catch(e){}}

function rnd(n){return Math.floor(Math.random()*n)}
function inB(r,c){return r>=0&&c>=0&&r<R&&c<C}
function idx(r,c){return r*C+c}

function generate(){
  C=Math.min(5+Math.floor(level/2),30);
  R=C<=11?Math.min(Math.round(C*1.5),16):Math.round(C*1.45);
  const rocks=level<3?0:Math.min(2+Math.floor(level/3),Math.floor(R*C*0.06));
  for(let attempt=0;attempt<20;attempt++){
    grid=new Array(R*C).fill(-1);
    for(let k=0;k<rocks;k++){grid[rnd(R*C)]=-2}
    pieces=[];
    let free=grid.filter(v=>v===-1).length, filled=0, target=free*0.82;
    for(let phase=0;phase<2;phase++)
    for(let tries=0;tries<Math.max(6000,R*C*(phase?8:12))&&filled<target;tries++){
      const hr=rnd(R),hc=rnd(C); if(grid[idx(hr,hc)]!==-1)continue;
      const d=rnd(4),[dr,dc]=DIRS[d];
      const ray=new Set(); let ok=true,r=hr+dr,c=hc+dc;
      while(inB(r,c)){if(grid[idx(r,c)]!==-1){ok=false;break}ray.add(idx(r,c));r+=dr;c+=dc}
      if(!ok)continue;
      const br=hr-dr,bc=hc-dc;
      if(!inB(br,bc)||grid[idx(br,bc)]!==-1)continue;
      const body=[[hr,hc],[br,bc]],used=new Set([idx(hr,hc),idx(br,bc)]);
      const maxLen=Math.min(4+Math.floor(level/3),18),minLen=Math.min(2+Math.floor(level/5),10);
      const want=phase?2+rnd(3):minLen+rnd(maxLen-minLen+1);
      let pd=[-dr,-dc];
      while(body.length<want){
        const [lr,lc]=body[body.length-1];
        let opts=DIRS.map(v=>[lr+v[0],lc+v[1],v]).filter(([r2,c2])=>inB(r2,c2)&&grid[idx(r2,c2)]===-1&&!used.has(idx(r2,c2))&&!ray.has(idx(r2,c2)));
        if(!opts.length)break;
        let pick=opts.find(o=>o[2][0]===pd[0]&&o[2][1]===pd[1]);
        if(!pick||Math.random()<0.45)pick=opts[rnd(opts.length)];
        body.push([pick[0],pick[1]]);used.add(idx(pick[0],pick[1]));pd=pick[2];
      }
      const id=pieces.length;
      for(const [r2,c2] of body)grid[idx(r2,c2)]=id;
      pieces.push({id,d,cells:body.slice().reverse(),gone:false,anim:null,bump:0});
      filled+=body.length;
    }
    // Grow tails into leftover gaps. A cell can join snake i only if no ray of
    // snake i or any later snake passes through it, so the board stays solvable.
    {
      const rayMax=new Array(R*C).fill(-1);
      for(const p of pieces){const [hr,hc]=p.cells[p.cells.length-1],[dr,dc]=DIRS[p.d];
        let r=hr+dr,c=hc+dc;while(inB(r,c)){const k=idx(r,c);rayMax[k]=Math.max(rayMax[k],p.id);r+=dr;c+=dc}}
      const cap=Math.min(4+Math.floor(level/3),18)+2;
      for(let pass=0;pass<cap;pass++){let grew=false;
        for(const p of pieces){if(p.cells.length>=cap)continue;
          const [tr,tc]=p.cells[0];
          const opts=DIRS.map(v=>[tr+v[0],tc+v[1]]).filter(([r,c])=>inB(r,c)&&grid[idx(r,c)]===-1&&rayMax[idx(r,c)]<p.id);
          if(!opts.length)continue;
          const [r,c]=opts[rnd(opts.length)];
          p.cells.unshift([r,c]);grid[idx(r,c)]=p.id;filled++;grew=true;}
        if(!grew)break;}
    }
    if(filled>=target*0.85&&pieces.length>=Math.min(6,R*C/4))break;
  }
  zm=1;panX=panY=0;total=pieces.length;if(!(hearts>0))hearts=1;mistakes=0;saveLives();hints=3;hintPiece=-1;
  layout();updateHud();
}

function layout(){
  const st=$('stage');
  W=st.clientWidth;H=st.clientHeight;
  const dpr=window.devicePixelRatio||1;
  cv.width=W*dpr;cv.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(!R)return;
  bcs=Math.min((W-12)/C,(H-12)/R);
  zoomable=C>11;
  if(!zoomable){zm=1;panX=panY=0}
  view();
}
// --- zoom & pan ---
let bcs=0,zm=1,panX=0,panY=0,zoomable=false;
function maxZoom(){return Math.max(1,52/bcs)}
function clampPan(){
  const bw=C*bcs*zm,bh=R*bcs*zm;
  const mx=Math.max(0,(bw-W)/2+16),my=Math.max(0,(bh-H)/2+16);
  panX=Math.max(-mx,Math.min(mx,panX));panY=Math.max(-my,Math.min(my,panY));
}
function view(){
  clampPan();
  cs=bcs*zm;ox=W/2-C*cs/2+panX;oy=H/2-R*cs/2+panY;
}
function zoomAt(nz,x,y){
  nz=Math.max(1,Math.min(maxZoom(),nz));
  view();
  const wx=(x-ox)/cs,wy=(y-oy)/cs,ncs=bcs*nz;
  panX=x-wx*ncs-W/2+C*ncs/2;panY=y-wy*ncs-H/2+R*ncs/2;zm=nz;view();
}
window.addEventListener('resize',layout);

function updateHud(){
  $('lvlLabel').textContent='LEVEL '+level;
  $('homeLvl').textContent='Level '+level;
  let h='';for(let i=0;i<3;i++)h+=HEART.replace('FILL',i<hearts?'#e11d2e':'#333333');
  $('hearts').innerHTML=h;
  $('hintN').textContent=hints;
  $('hint').style.opacity=hints?1:.45;
  const cleared=pieces?pieces.filter(p=>p.gone||p.anim).length:0;
  $('progFill').style.width=(total?cleared/total*100:0)+'%';
}

function blocker(p){
  const [hr,hc]=p.cells[p.cells.length-1],[dr,dc]=DIRS[p.d];
  let r=hr+dr,c=hc+dc;
  while(inB(r,c)){const v=grid[idx(r,c)];if(v!==-1&&v!==p.id)return v;r+=dr;c+=dc}
  return null;
}

function tapPiece(p){
  if(p.gone||p.anim)return;
  const b=blocker(p);
  if(b!==null){
    p.bump=performance.now();
    if(b>=0)pieces[b].bump=performance.now();
    hearts--;mistakes++;saveLives();updateHud();
    if(navigator.vibrate)try{navigator.vibrate(80)}catch(e){}
    if(hearts<=0){state='lost';setTimeout(()=>sheet('Out of hearts','You start back at 1 heart. Same level, fresh board.','Try again'),500)}
    return;
  }
  const [dr,dc]=DIRS[p.d],path=p.cells.map(x=>[x[0],x[1]]);
  let [r,c]=path[path.length-1];
  const extra=Math.max(R,C)+p.cells.length+2;
  for(let i=0;i<extra;i++){r+=dr;c+=dc;path.push([r,c])}
  for(const [r2,c2] of p.cells)grid[idx(r2,c2)]=-1;
  p.anim={path,s:0,max:extra};
  if(hintPiece===p.id)hintPiece=-1;
  updateHud();
}

const ptrs=new Map();let gesture=null;
function local(e){const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}
cv.addEventListener('pointerdown',e=>{
  if(state!=='play')return;
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  ptrs.set(e.pointerId,local(e));
  if(ptrs.size===1){const [x,y]=local(e);gesture={x0:x,y0:y,lx:x,ly:y,moved:false,pinched:false,held:false};
    const g=gesture;
    g.timer=setTimeout(()=>{g.timer=null;if(gesture!==g||g.moved||g.pinched||state!=='play')return;
      const p=pieceAt(g.x0,g.y0);if(!p)return;g.held=true;preview=p.id;
      if(navigator.vibrate)try{navigator.vibrate(15)}catch(_){}},350);}
  else if(ptrs.size===2&&zoomable&&gesture){
    const [a,b]=[...ptrs.values()];
    clearHold(gesture);preview=-1;gesture.pinched=true;gesture.d0=Math.hypot(a[0]-b[0],a[1]-b[1]);gesture.z0=zm;
  }
});
cv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId)||!gesture)return;
  const p=local(e);ptrs.set(e.pointerId,p);
  if(ptrs.size>=2&&gesture.pinched){
    const [a,b]=[...ptrs.values()];
    const d=Math.hypot(a[0]-b[0],a[1]-b[1]),mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;
    if(gesture.mx!==undefined){panX+=mx-gesture.mx;panY+=my-gesture.my}
    gesture.mx=mx;gesture.my=my;
    zoomAt(gesture.z0*d/gesture.d0,mx,my);
  }else if(ptrs.size===1){
    if(Math.hypot(p[0]-gesture.x0,p[1]-gesture.y0)>10){gesture.moved=true;clearHold(gesture);preview=-1}
    if(gesture.moved&&zoomable&&zm>1){panX+=p[0]-gesture.lx;panY+=p[1]-gesture.ly;view()}
    gesture.lx=p[0];gesture.ly=p[1];
  }
});
function endPtr(e){
  if(!ptrs.has(e.pointerId))return;
  ptrs.delete(e.pointerId);
  if(ptrs.size===0&&gesture){
    const g=gesture;gesture=null;
    clearHold(g);
    if(g.held){preview=-1;return}
    if(!g.moved&&!g.pinched&&state==='play')tapAt(g.x0,g.y0);
  }
}
cv.addEventListener('pointerup',endPtr);
cv.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);if(!ptrs.size){clearHold(gesture);gesture=null;preview=-1}});
cv.addEventListener('wheel',e=>{if(!zoomable)return;e.preventDefault();const [x,y]=local(e);zoomAt(zm*(e.deltaY<0?1.15:1/1.15),x,y)},{passive:false});
function pieceAt(x,y){
  view();
  let best=null,bd=1e9;
  for(const p of pieces){if(p.gone||p.anim)continue;
    for(const [pr,pc] of p.cells){
      const d=Math.hypot(ox+(pc+.5)*cs-x,oy+(pr+.5)*cs-y);
      if(d<bd){bd=d;best=p}
    }}
  return best&&bd<Math.max(cs*0.75,14)?best:null;
}
function tapAt(x,y){const p=pieceAt(x,y);if(p)tapPiece(p)}
let preview=-1;
function clearHold(g){if(g&&g.timer){clearTimeout(g.timer);g.timer=null}}

// screens
function show(id){for(const s of ['home','game'])$(s).classList.toggle('hide',s!==id);if(id==='game')layout()}
function startLevel(){$('sheetWrap').classList.add('hide');show('game');generate();state='play'}
function goHome(){$('sheetWrap').classList.add('hide');state='menu';updateHud();show('home')}
function sheet(t,m,b){$('sTitle').textContent=t;$('sMsg').textContent=m;$('sBtn').textContent=b;$('sheetWrap').classList.remove('hide')}

$('play').onclick=startLevel;
$('sBtn').onclick=startLevel;
$('sHome').onclick=goHome;
$('homeBtn').onclick=goHome;
$('restart').onclick=()=>{if(state==='play'||state==='lost')startLevel()};
$('hint').onclick=()=>{
  if(state!=='play'||hints<=0)return;
  const free=pieces.find(p=>!p.gone&&!p.anim&&blocker(p)===null);
  if(free){hintPiece=free.id;hintUntil=performance.now()+2200;hints--;updateHud();
    if(zm>1){const [hr,hc]=free.cells[free.cells.length-1];panX+=W/2-(ox+(hc+.5)*cs);panY+=H/2-(oy+(hr+.5)*cs);view()}}
};

// drawing
function pt(path,f){
  const i=Math.max(0,Math.min(path.length-1,Math.floor(f))),j=Math.min(path.length-1,i+1),t=f-i;
  const a=path[i],b=path[j];
  return [ox+((a[1]+(b[1]-a[1])*t)+.5)*cs, oy+((a[0]+(b[0]-a[0])*t)+.5)*cs];
}
function drawPiece(p,now){
  let path=p.cells,s=0;
  if(p.anim){path=p.anim.path;s=p.anim.s}
  const n=p.cells.length,f0=s,f1=s+n-1;
  const pts=[pt(path,f0)];
  for(let k=Math.floor(f0)+1;k<f1;k++)pts.push(pt(path,k));
  pts.push(pt(path,f1));
  let sx=0,sy=0,col=SNAKE;
  const bt=now-p.bump;
  if(bt<380){const a=Math.sin(bt/380*Math.PI*4)*cs*0.12*(1-bt/380);sx=DIRS[p.d][1]*a;sy=DIRS[p.d][0]*a;col='#e11d2e'}
  const glow=(p.id===hintPiece&&now<hintUntil)||p.id===preview;
  ctx.save();ctx.translate(sx,sy);
  ctx.lineCap='round';ctx.lineJoin='round';
  if(glow){ctx.shadowColor='#e11d2e';ctx.shadowBlur=22+10*Math.sin(now/120)}
  ctx.strokeStyle=col;ctx.lineWidth=cs*0.3;
  const [hx,hy]=pts[pts.length-1],[dr,dc]=DIRS[p.d];
  ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
  for(let k=1;k<pts.length;k++)ctx.lineTo(pts[k][0],pts[k][1]);
  ctx.stroke();
  const hs=cs*0.32;
  ctx.fillStyle=col;ctx.beginPath();
  ctx.moveTo(hx+dc*hs*1.3,hy+dr*hs*1.3);
  ctx.lineTo(hx-dr*hs-dc*hs*0.2,hy+dc*hs-dr*hs*0.2);
  ctx.lineTo(hx+dr*hs-dc*hs*0.2,hy-dc*hs-dr*hs*0.2);
  ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle='#0a0a0a';
  const ex=dc*hs*0.22,ey=dr*hs*0.22,px=-dr*hs*0.36,py=dc*hs*0.36,er=Math.max(1.5,cs*0.045);
  ctx.beginPath();ctx.arc(hx+ex+px,hy+ey+py,er,0,7);ctx.arc(hx+ex-px,hy+ey-py,er,0,7);ctx.fill();
  ctx.restore();
}

function drawPreview(p,now){
  if(!p||p.gone||p.anim){preview=-1;return}
  const [hr,hc]=p.cells[p.cells.length-1],[dr,dc]=DIRS[p.d];
  let r=hr+dr,c=hc+dc,hit=null;
  while(inB(r,c)){const v=grid[idx(r,c)];if(v!==-1&&v!==p.id){hit=[r,c];break}r+=dr;c+=dc}
  const sx=ox+(hc+.5)*cs+dc*cs*0.55,sy=oy+(hr+.5)*cs+dr*cs*0.55;
  let ex,ey;
  if(hit){ex=ox+(hit[1]+.5)*cs-dc*cs*0.5;ey=oy+(hit[0]+.5)*cs-dr*cs*0.5}
  else{ex=dc>0?W+20:dc<0?-20:sx;ey=dr>0?H+20:dr<0?-20:sy}
  const col=hit?'#e11d2e':'#ffffff';
  ctx.save();
  ctx.strokeStyle=col;ctx.globalAlpha=0.9;ctx.lineWidth=Math.max(2,cs*0.09);ctx.lineCap='round';
  ctx.setLineDash([cs*0.18,cs*0.2]);ctx.lineDashOffset=-now/30;
  ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(ex,ey);ctx.stroke();ctx.setLineDash([]);
  if(hit){
    const bx=ox+(hit[1]+.5)*cs,by=oy+(hit[0]+.5)*cs,k=cs*0.22;
    ctx.lineWidth=Math.max(3,cs*0.12);
    ctx.beginPath();ctx.arc(bx,by,cs*0.42,0,7);ctx.stroke();
    ctx.beginPath();ctx.moveTo(bx-k,by-k);ctx.lineTo(bx+k,by+k);ctx.moveTo(bx+k,by-k);ctx.lineTo(bx-k,by+k);ctx.stroke();
  }
  ctx.restore();
}

let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(state!=='menu'&&R){
    view();
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='rgba(255,255,255,.06)';
    for(let r=0;r<R;r++)for(let c=0;c<C;c++){ctx.beginPath();ctx.arc(ox+(c+.5)*cs,oy+(r+.5)*cs,cs*0.05,0,7);ctx.fill()}
    for(let r=0;r<R;r++)for(let c=0;c<C;c++)if(grid[idx(r,c)]===-2){
      const x=ox+c*cs+cs*0.14,y=oy+r*cs+cs*0.14,s=cs*0.72;
      ctx.fillStyle='#3a3a3a';ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,s,s,cs*0.22):ctx.rect(x,y,s,s);ctx.fill();
      ctx.fillStyle='#4d4d4d';ctx.beginPath();ctx.arc(x+s*0.35,y+s*0.35,s*0.15,0,7);ctx.fill();
    }
    let left=0;
    for(const p of pieces){
      if(p.gone)continue;
      if(p.anim){p.anim.s+=dt*(14+p.anim.s*2.5);if(p.anim.s>=p.anim.max){p.gone=true;continue}}
      left++;drawPiece(p,now);
    }
    if(preview>=0&&state==='play')drawPreview(pieces[preview],now);
    if(state==='play'&&left===0){
      state='won';level++;try{localStorage.setItem('so_level',level)}catch(e){}
      updateHud();
      let msg;
      if(mistakes===0&&hearts<3){hearts++;msg='Perfect! +1 heart. You have '+hearts+' now.'}
      else if(mistakes===0)msg='Perfect! Hearts are already full.';
      else msg='Cleared with '+hearts+' heart'+(hearts>1?'s':'')+'. Go perfect next time to earn one.';
      saveLives();updateHud();
      setTimeout(()=>sheet(mistakes===0?'Perfect!':'Board clear!',msg,'Level '+level),350);
    }
  }
  requestAnimationFrame(loop);
}
updateHud();requestAnimationFrame(loop);

// share
const SHARE_URL='https://thephilly640.github.io/snakes/';
async function share(){
  const text=level>1?'I made it to level '+level+' in Snakes. Beat that:':'Try Snakes, a snake puzzle game:';
  if(navigator.share){try{await navigator.share({title:'Snakes',text,url:SHARE_URL})}catch(e){}return}
  try{await navigator.clipboard.writeText(text+' '+SHARE_URL)}catch(e){}
  const t=$('toast');t.classList.remove('hide');setTimeout(()=>t.classList.add('hide'),1800);
}
$('share').onclick=share;$('shareHome').onclick=share;$('sShare').onclick=share;

// installable app
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
const standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;if(!standalone)$('install').classList.remove('hide')});
$('install').onclick=async()=>{
  if(!deferredPrompt)return;
  deferredPrompt.prompt();
  try{await deferredPrompt.userChoice}catch(e){}
  deferredPrompt=null;$('install').classList.add('hide');
};
window.addEventListener('appinstalled',()=>$('install').classList.add('hide'));
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
if(isIOS&&!standalone)$('iosTip').classList.remove('hide');
document.addEventListener('gesturestart',e=>e.preventDefault());
</script>
